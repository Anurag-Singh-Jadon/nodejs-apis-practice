<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 120px;
            margin-bottom: 10px;
            color: #333;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #444;
        }

        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for doesn't exist
            or has been moved.
        </p>

        <a href="/">Go to Home Page</a>
    </div>

</body>
</html>
